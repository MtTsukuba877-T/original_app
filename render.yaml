# Render Blueprint for original_app (卒業制作 MVP)
# 参考: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tiishi74b-original-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 本番でメールを送信するため、有料のプランにする（Issue #137）。
    # 無料プランは、SMTP のポート（25・465・587）への送信がブロックされる。
    plan: 0.5c-512mb
    region: singapore
    branch: main
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # メール配信（Gmail の SMTP）で使う。値は Render の画面で設定する（Issue #137）。
      - key: SMTP_USER_NAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
